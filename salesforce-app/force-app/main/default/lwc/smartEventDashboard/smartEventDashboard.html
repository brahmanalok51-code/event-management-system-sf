<template>
    <div class="dashboard-wrapper">
        <!-- Top KPI Summary Banner -->
        <div class="slds-box slds-theme_default slds-m-bottom_medium">
            <div class="slds-grid slds-wrap slds-grid_vertical-align-center">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <div class="slds-media slds-media_center">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="standard:campaign" size="large"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="slds-page-header__title slds-truncate">Smart Event Command Center</h1>
                            <p class="slds-text-body_small slds-text-color_weak">
                                Real-Time Salesforce + Node.js QR Ticketing &amp; Gate Telemetry
                            </p>
                        </div>
                    </div>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                    <div class="slds-grid slds-grid_align-end slds-gutters_small slds-m-top_small slds-medium-m-top_none">
                        <div class="slds-col">
                            <div class="kpi-pill slds-box slds-box_xx-small slds-text-align_center">
                                <span class="slds-text-title_caps">Active Events</span>
                                <p class="slds-text-heading_medium">{totalEventsCount}</p>
                            </div>
                        </div>
                        <div class="slds-col">
                            <div class="kpi-pill slds-box slds-box_xx-small slds-text-align_center">
                                <span class="slds-text-title_caps">Registered</span>
                                <p class="slds-text-heading_medium">{totalRegisteredCount}</p>
                            </div>
                        </div>
                        <div class="slds-col">
                            <div class="kpi-pill slds-box slds-box_xx-small slds-text-align_center">
                                <span class="slds-text-title_caps">Seats Open</span>
                                <p class="slds-text-heading_medium slds-text-color_success">{totalAvailableSeats}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global SOSL Search Component -->
        <c-event-search-bar onsearchresult={handleSearchResult}></c-event-search-bar>

        <!-- SOSL Matching Registrations Banner (Sirf tab dikhega jab search se attendees/tokens match hon) -->
        <template lwc:if={hasMatchingRegistrations}>
            <div class="slds-box slds-theme_shade slds-m-bottom_medium">
                <h3 class="slds-text-title_caps slds-m-bottom_x-small">
                    Matching Tickets / Attendees ({matchingRegistrations.length}) — Click to Inspect Event
                </h3>
                <div class="slds-grid slds-wrap slds-gutters_x-small">
                    <template for:each={matchingRegistrations} for:item="reg">
                        <div key={reg.Id} class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_x-small">
                            <div class="slds-box slds-box_xx-small search-reg-pill"
                                 data-eventid={reg.Smart_Event__c}
                                 data-eventname={reg.eventName}
                                 onclick={handleSearchRegClick}>
                                <p class="slds-text-body_small">
                                    <strong>{reg.attendeeName}</strong> ({reg.Ticket_Tier__c})
                                </p>
                                <p class="slds-text-body_small slds-text-color_weak">
                                    Token: <code>{reg.QR_Code_Token__c}</code> &bull; Event: {reg.eventName}
                                </p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Main 2-Column Workspace -->
        <div class="slds-grid slds-wrap slds-gutters">
            <!-- Left 4 Columns: Event List Panel -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12 slds-m-bottom_medium">
                <c-event-list-panel
                    events={displayedEvents}
                    selected-event-id={selectedEventId}
                    oneventselect={handleEventSelect}>
                </c-event-list-panel>
            </div>

            <!-- Right 8 Columns: Event & QR Pass Inspector -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                <c-event-detail-inspector
                    onregistrationcreated={handleRegistrationCreated}>
                </c-event-detail-inspector>
            </div>
        </div>
    </div>
</template>
