<template>
    <lightning-card title="Smart Events" icon-name="standard:event">
        <div slot="actions">
            <lightning-badge label={eventCountLabel}></lightning-badge>
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template lwc:if={hasEvents}>
                <template for:each={decoratedEvents} for:item="evt">
                    <div key={evt.Id}
                         data-id={evt.Id}
                         data-name={evt.Name}
                         onclick={handleEventSelect}
                         class={evt.cardClass}>
                        
                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xx-small">
                            <span class="slds-text-heading_small slds-truncate" title={evt.Name}>
                                {evt.Name}
                            </span>
                            <lightning-badge label={evt.Event_Status__c}></lightning-badge>
                        </div>

                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                            <strong>Code:</strong> {evt.Event_Code__c} &bull; <strong>Venue:</strong> {evt.Venue__c}
                        </p>

                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                            <span class="slds-text-body_small">
                                <lightning-formatted-date-time
                                    value={evt.Start_Date_Time__c}
                                    year="numeric"
                                    month="short"
                                    day="2-digit"
                                    hour="2-digit"
                                    minute="2-digit">
                                </lightning-formatted-date-time>
                            </span>
                            <span class={evt.seatBadgeClass}>
                                {evt.seatLabel}
                            </span>
                        </div>
                    </div>
                </template>
            </template>

            <template lwc:else>
                <div class="slds-align_absolute-center slds-p-vertical_large slds-text-color_weak">
                    <p>No matching events found.</p>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
